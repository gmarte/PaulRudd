# ─────────────────────────────────────────────────────────────────────────────
# Paul — AI PR Review  |  Consumer workflow template
# ─────────────────────────────────────────────────────────────────────────────
# Copy this file to .github/workflows/paul.yml in the repos you want reviewed.
#
# Setup steps:
# 1. Add your LLM API key as a repository secret (e.g. ANTHROPIC_API_KEY).
# 2. Optionally copy .paul.yml.example to .paul.yml in the repo root and
#    customise it. Paul reads it from the PR's base branch, so a change to it
#    applies once it is merged.
# 3. Enable branch protection: require the "Paul / AI PR Review" status check.
# 4. Protect this workflow file too (see "Hardening the gate" in Paul's README):
#    a PR runs its own copy of it, so without a code-owner review a PR could
#    edit the job away.
#
# No checkout step is needed: Paul reads the diff and the config through the
# GitHub API, so the PR's code never lands on the runner.
# ─────────────────────────────────────────────────────────────────────────────

name: Paul PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Restrict to specific branches (optional — remove to review all PRs):
    # branches:
    #   - main
    #   - master
    #   - dev
  # Only needed if you use a merge queue: the required check must report there
  # too. The job below is skipped (which counts as passing) for queue runs,
  # because the PR was already reviewed.
  merge_group:

permissions:
  contents: read
  pull-requests: write

# A new push cancels the review still running for the previous one.
concurrency:
  group: paul-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paul:
    name: "Paul / AI PR Review"
    # Drafts are reviewed when they are marked ready for review.
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # Paul stops itself before this (time_budget_minutes, 45 by default) and
    # reports any files it didn't get to.
    timeout-minutes: 60
    steps:
      - name: Run Paul
        uses: gmarte/PaulRudd@v2  # or pin a full commit SHA
        with:
          # Change the secret name below to match the key for your chosen provider:
          #   Anthropic → ANTHROPIC_API_KEY
          #   OpenAI    → OPENAI_API_KEY
          #   Google    → GOOGLE_API_KEY
          api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # config_path: ".paul.yml"  # default — override if needed
