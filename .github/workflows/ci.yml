name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Paul
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      # The action installs LiteLLM only for OpenAI and Gemini, so nothing on the
      # Claude path may import it.
      - name: Check that the Claude path runs without LiteLLM
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, "src")
          import paul, llm_anthropic  # noqa: F401
          assert "litellm" not in sys.modules, "the Claude path imports LiteLLM"
          EOF

      - name: Install LiteLLM and the test dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-litellm.lock
          python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
