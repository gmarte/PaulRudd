# Paul reviews its own PRs with the code on the PR branch (uses: ./), so every
# change to Paul runs on a real PR before it is released. Because the PR
# supplies the code that reviews it, this is a smoke test, not a merge gate.
#
# Optional: the LLM API key belongs to whoever runs Paul, so this repo doesn't
# need one. Without an ANTHROPIC_API_KEY secret the job passes with a notice;
# add the secret to have Paul review every PR here.
name: Paul self-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: paul-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  paul:
    name: "Paul / AI PR Review"
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check for an API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No ANTHROPIC_API_KEY secret in this repository, so the self-review is skipped."
          fi

      # The checkout is only needed so `uses: ./` can find action.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false

      - name: Run Paul (this branch)
        if: steps.key.outputs.present == 'true'
        uses: ./
        with:
          api_key: ${{ secrets.ANTHROPIC_API_KEY }}
